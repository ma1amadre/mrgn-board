<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="theme-color" content="#0b6e5c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRGN board</title>
    <script>
      // Тема из localStorage до первой отрисовки, чтобы не мигало светлым (ключ — THEME_KEY в app/theme.ts).
      try {
        var t = localStorage.getItem('mrgn-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
